name: Ethio Live test download

# Builds the Ethio Live debug APK against the real backend and publishes it as a public download on the
# "ethio-live-test" release, so testers can install it from one link without a GitHub account:
#   https://github.com/kabtamu2281/sheger-live/releases/download/ethio-live-test/ethio-live.apk
# Each run replaces the previous build at the same link. Run it from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main
  push:
    branches: [claude/clever-goodall-12vbtq]
    paths: ['.github/workflows/ethio-live-share.yml']

concurrency:
  group: ethio-live-share
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish test APK
    runs-on: ubuntu-latest
    env:
      BUILD_REF: ${{ inputs.ref || 'main' }}
      TAG: ethio-live-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ethio-live/android
        env:
          SUPABASE_URL: ${{ vars.ETHIO_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.ETHIO_SUPABASE_ANON_KEY }}
          AGORA_APP_ID: ${{ vars.ETHIO_AGORA_APP_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.ETHIO_GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::ETHIO_SUPABASE_URL and ETHIO_SUPABASE_ANON_KEY variables are needed, or the app shows 'Server not configured'"
            exit 1
          fi
          ./gradlew --no-daemon :app:assembleDebug

      - name: No secrets in the built APK
        working-directory: ethio-live/android
        run: ../tools/check-no-secrets.sh "$PWD/app/build/outputs/apk/debug/app-debug.apk"

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ethio-live/android/app/build/outputs/apk/debug/app-debug.apk ethio-live.apk
          sha=$(git rev-parse HEAD)
          notes="Test build of Ethio Live for Android 8+ (debug build, for testers only).

          Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ethio-live.apk

          How to install: open the link on the phone, download, open the file, allow \"Install from this source\" if asked, then Install.
          To update, install the new file over the old one.

          Built from ${BUILD_REF} at ${sha:0:7} on $(date -u +%Y-%m-%d)."
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" ethio-live.apk --target "$sha" --prerelease --latest=false \
            --title "Ethio Live test build" --notes "$notes"
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ethio-live.apk"
