name: Ethio Live

on:
  push:
    paths: ['ethio-live/**', '.github/workflows/ethio-live.yml']
  pull_request:
    paths: ['ethio-live/**', '.github/workflows/ethio-live.yml']
  workflow_dispatch:

jobs:
  database:
    name: Database tests (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ethio-live/supabase/tests
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ethio-live/supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check */index.ts
      - run: deno test _shared/shared_test.ts

  admin:
    name: Admin dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ethio-live/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    name: Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ethio-live/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: String resources match the code
        run: python3 ../tools/i18n/gen.py && git diff --exit-code -- app/src/main/res
      - name: No secrets in client source
        run: ../tools/check-no-secrets.sh
      - name: Core unit tests
        run: ./gradlew --no-daemon :core:test
      - name: Build debug APK
        # Optional repository variables point the CI build at a real backend. Only public identifiers belong here.
        env:
          SUPABASE_URL: ${{ vars.ETHIO_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.ETHIO_SUPABASE_ANON_KEY }}
          AGORA_APP_ID: ${{ vars.ETHIO_AGORA_APP_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.ETHIO_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: No secrets in the built APK
        run: ../tools/check-no-secrets.sh "$PWD/app/build/outputs/apk/debug/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ethio-live-debug-apk
          path: ethio-live/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ethio-live-test-reports
          path: |
            ethio-live/android/core/build/reports/tests/
            ethio-live/android/app/build/reports/
